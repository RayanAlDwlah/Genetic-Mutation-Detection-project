name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install OS-level dependencies
        # liblzma: transformers tokenizer requires lzma at runtime.
        # dssp: secondary-structure assignment (biopython wrapper).
        # swig: freesasa Python bindings are generated via SWIG at build time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblzma-dev dssp swig

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity — tokenizer stack loads
        run: |
          python -c "import lzma; print('lzma OK')"
          python -c "from transformers import AutoTokenizer; print('transformers OK')"

      - name: Leakage gate (CLI)
        run: |
          python -m src.verify_no_leakage

      - name: pytest (with coverage)
        # needs_gpu tests download the 35M ESM-2 checkpoint from the
        # Hugging Face Hub and run the model; they are deselected here and
        # run locally with `pytest -m needs_gpu`. Everything else, including
        # the integration tests on the committed splits and checkpoints, runs.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ -n auto -m "not needs_gpu" --cov-report=xml

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
